# nginx server config for the TestGrid single-page app.
#
# The app uses client-side routing (History API): URLs like
# /prow-heartbeat-autoscale/hpa exist only in the browser, not as files on disk.
# Without a fallback, nginx returns 404 for those paths on reload / direct link /
# shared URL, which leaves the user on a 404 page with no app UI (and thus no
# "TestGrid" home link to click). try_files serves index.html for any path that
# isn't a real file, so the client router can render the right view.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
